.landing-image-slot {

.landing-grid-wrap {
  display: flex;

.button-grid {
  position: relative;

.sound-btn {
  position: absolute;

  width: var(--size, 10vw);
  height: var(--size, 10vw);

  border-radius: 50%;
  border: none;
  cursor: pointer;

  background-color: var(--color, var(--accent-color));

  left: var(--x, 50vw);
  top: var(--y, 50vh);
  transform: translate(-50%, -50%);

  --hover-scale: 1.05;
  --pluck-depth: 0.96;
  --pluck-duration: 180ms;
  --fade-duration: 1.9s;

  transition:
    transform 120ms ease,
    filter var(--fade-duration) ease-out,
    opacity var(--fade-duration) ease-out;
}

.sound-btn:hover {
}

.sound-btn.active {
  opacity: 1;
  filter:
    brightness(2.8)
    saturate(2.4)
    drop-shadow(0 0 0.45rem var(--accent-color))
    drop-shadow(0 0 1.1rem rgba(102, 205, 170, 0.45));
  animation: pluck var(--pluck-duration) ease-out;
}

@keyframes pluck {
  0%   { transform: scale(var(--hover-scale)); }
  45%  { transform: scale(var(--pluck-depth)); }
  100% { transform: scale(var(--hover-scale)); }
}

<script>
function syncLandingWidth() {
  const navInner = document.querySelector(".secondary-nav .nav-inner");
  const landingWrap = document.querySelector(".landing-grid-wrap");
  if (!navInner || !landingWrap) return;
  landingWrap.style.width = navInner.getBoundingClientRect().width + "px";
}

window.addEventListener("load", syncLandingWidth);
window.addEventListener("resize", syncLandingWidth);
document.fonts?.ready?.then(syncLandingWidth);

let keyboardArmed = false;

const grid = document.querySelector(".button-grid");
grid.addEventListener("pointerenter", () => {
  keyboardArmed = true;
});
grid.addEventListener("pointerleave", () => {
  keyboardArmed = false;
});

const buttons = document.querySelectorAll(".sound-btn");

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---------- Tone.js audio ---------- */
let chordTimer = null;
let currentPitches = [];
let audioReady = false;
let unlockPromise = null;
let pendingNoteIndex = null;

function buildChord() {
  const rootInt = randomInt(32, 56);
  const stepInt = randomInt(2, 14);

  const rootHz = rootInt * 4;
  const stepHz = stepInt * 4;

  currentPitches = shuffle([
    rootHz,
    rootHz + stepHz,
    rootHz + stepHz * 2,
    rootHz + stepHz * 3
  ]);
}

function setIOSPlaybackSession() {
  if (navigator.audioSession && "type" in navigator.audioSession) {
    try {
      navigator.audioSession.type = "playback";
    } catch (err) {
      console.warn("Could not set audioSession.type:", err);
    }
  }
}

function primeAudio() {
  const primer = new Tone.Synth().toDestination();
  primer.volume.value = -90;
  primer.triggerAttackRelease(500, 1);
  setTimeout(() => primer.dispose(), 1000);
}

async function unlockAudio() {
  if (audioReady) return;
  if (unlockPromise) return unlockPromise;

  unlockPromise = (async () => {
    setIOSPlaybackSession();

    await Tone.start();
    primeAudio();

    audioReady = true;

    if (!currentPitches.length) {
      buildChord();
      scheduleNextChordChange();
    }

    if (pendingNoteIndex !== null) {
      const index = pendingNoteIndex;
      pendingNoteIndex = null;
      playNote(index);
    }
  })().catch((err) => {
    console.warn("Audio unlock failed:", err);
    audioReady = false;
  }).finally(() => {
    unlockPromise = null;
  });

  return unlockPromise;
}

const masterDelay = new Tone.FeedbackDelay({
  delayTime: 0.5,
  feedback: 0.3,
  wet: 0.15
}).toDestination();

function playNote(index) {
  if (!currentPitches.length) return;

  const freq = currentPitches[index % currentPitches.length];
  const duration = 10;

  // map frequency to a near-edge stereo pan:
  // Tone.Panner expects -1 (left) to 1 (right)
  const pan = ((freq % 9) / 9) * 1.7 - 0.85;

  const notePanner = new Tone.Panner(pan).connect(masterDelay);  
  
  const noteFilter = new Tone.Filter({
    type: "lowpass",
    frequency: 3000,
    rolloff: -24
  }).connect(notePanner);

  const noteSynth = new Tone.Synth({
    oscillator: { type: "triangle" },
    envelope: {
      attack: 0.002 + Math.random() * 0.005,
      decay: 5 + Math.random() * 5,
      sustain: 0,
      release: 0.2 + Math.random() * 0.2
    }
  }).connect(noteFilter);

  const noteSynthSineHigh = new Tone.Synth({
    oscillator: { type: "sine" },
    envelope: {
      attack: 0.0015 + Math.random() * 0.001,
      decay: 2 + Math.random() * 2,
      sustain: 0,
      release: 0.2 + Math.random() * 0.2
    }
  }).connect(notePanner);

  let volume;

  if (Math.random() < 0.15) {
    volume = -8 - Math.random() * 6;
  } else {
    const r = Math.random();
    volume = -15 - Math.pow(r, 2) * 20;
  }

  noteSynth.volume.value = volume;
  noteSynth.triggerAttackRelease(freq, duration);

  noteFilter.frequency.setValueAtTime(3000, Tone.now());
  noteFilter.frequency.rampTo(400, 2);

  noteSynthSineHigh.volume.value = volume - 22 - Math.random() * 18;
  noteSynthSineHigh.triggerAttackRelease(freq * 23 / 4, duration);

  const cleanupMs = Math.ceil((duration + 0.5) * 1000);
  setTimeout(() => {
    noteSynth.dispose();
    noteSynthSineHigh.dispose();
    noteFilter.dispose();
    notePanner.dispose();
  }, cleanupMs);
}

function scheduleNextChordChange() {
  clearTimeout(chordTimer);

  const delay = 5000 + Math.random() * 5000;
  chordTimer = setTimeout(() => {
    buildChord();
    scheduleNextChordChange();
  }, delay);
}

buildChord();
scheduleNextChordChange();

/* ---------- visual click behavior ---------- */
function activateButton(btn, index) {
  const depth = 0.94 + Math.random() * 0.03;
  const pluckDuration = 140 + Math.random() * 60;
  const fadeDuration = 0.7 + Math.random() * 0.4;
  const releaseDelay = 80 + Math.random() * 80;

  btn.style.setProperty("--pluck-depth", depth.toFixed(3));
  btn.style.setProperty("--pluck-duration", pluckDuration + "ms");
  btn.style.setProperty("--fade-duration", fadeDuration + "s");

  btn.classList.add("active");

  if (!audioReady) {
    pendingNoteIndex = index;
    void unlockAudio();
  } else {
    playNote(index);
  }

  setTimeout(() => {
    btn.classList.remove("active");
  }, releaseDelay);
}

/* mouse / touch */
buttons.forEach((btn, index) => {
  btn.addEventListener("click", () => activateButton(btn, index));
});

/* keyboard (layout-independent using event.code) */
const keyMap = {
  Digit1: 0,
  Digit2: 1,
  Digit3: 2,
  Digit4: 3,

  Numpad1: 0,
  Numpad2: 1,
  Numpad3: 2,
  Numpad4: 3,

  KeyQ: 0,
  KeyW: 1,
  KeyE: 2,
  KeyR: 3,

  KeyA: 0,
  KeyS: 1,
  KeyD: 2,
  KeyF: 3
};

window.addEventListener("keydown", (event) => {
  if (!keyboardArmed) return;
  if (event.repeat) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  const tag = event.target?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || event.target?.isContentEditable) return;

  const index = keyMap[event.code];
  if (index === undefined) return;

  event.preventDefault();
  activateButton(buttons[index], index);
});
</script>
