<!doctype html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<title>Compositions</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<link href="main.css" rel="stylesheet">

<style>
#piece-divider { display: none; }

.breadcrumbs {
  font-size: 0.9rem;
  opacity: 0.7;
}

.breadcrumbs:empty { display: none; }
  
#filter-breadcrumbs:empty {
  display: none;
}

.breadcrumbs .sep { margin: 0 0.3rem; }

#search {
  display: block;
  width: auto;
  padding: 2px 0;
  margin-bottom: 0.8rem;
  font-family: inherit;
  font-size: 1rem;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--accent-color);
  color: var(--text-color);
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
  background-color: transparent;
  box-shadow: none;
}

#search:focus { outline: none; }

#piece-container { line-height: 1.5; }

#piece-container > * + * { margin-top: 0.45rem; }

#piece-container .movement-list {
  opacity: 0.9;
  margin-bottom: 0;
  padding-left: 0.8rem;
}

#piece-container .movement-list li + li { margin-top: 0.12rem; }

.piece-title + .movement-list { margin-top: 0.2rem; }

#score-link { margin-top: 0.7rem; }

.filters { color: rgba(255,255,255,0.6); }

.filters button {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  color: var(--accent-color);
  cursor: pointer;
  opacity: 0.7;
}

.filters button:hover,
.filters button.active-filter {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.filters button.active-filter {
  font-style: italic;
  opacity: 1;
}

.nav-inner {
  display: inline-block;
  white-space: nowrap;
}

#no-results { opacity: 0.7; }
.movement-match {
  opacity: 0.7;
}

.meta::before {
  content: "Instrumentation: ";
  opacity: 0.6;
}

.movement-meta {
  opacity: 0.7;
}

.piece-title + .meta {
  margin-top: 0.2rem;
}
.instrument-link {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.media-block {
  margin-top: 0.5rem;
}

.media-block iframe {
  width: 100%;
  height: 120px; /* SoundCloud default feel */
  border: none;
}

/* YouTube gets slightly more presence */
.media-block iframe[src*="youtube"] {
  height: 200px;
}
  
.youtube-trigger {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  color: var(--accent-color);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* overlay */
.yt-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  pointer-events: auto;
  backdrop-filter: blur(1px);
}

/* visible state */
.yt-modal.open {
  display: flex;
  display: flex;
  pointer-events: auto;
}

body.modal-open > *:not(.yt-modal) {
  pointer-events: none;
}

/* inner box */
.yt-modal-inner {
  position: relative;
  width: min(90vw, 640px);
}

/* video */
.yt-frame iframe {
  width: 100%;
  height: 360px;
  border: none;
}

/* close button */
#yt-close {
  position: absolute;
  top: -28px;
  right: 0;

  background: none;
  border: none;
  color: var(--text-color);
  font-size: 1.2rem;
  cursor: pointer;
}

.media-link {
  font-size: 0.9rem;
  opacity: 0.7;
}
.media-preview {
  margin-top: 0.5rem;
  filter: grayscale(20%);
  max-width: 100%;
}

.media-preview button {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
  display: block;
}

.media-preview img {
  width: 100%;
  height: auto;
  display: block;
  opacity: 0.9;
}

.media-preview img:hover {
  opacity: 1;
}

.media-label {
  display: block;
  font-size: 0.9rem;
  opacity: 0.7;
  text-decoration: underline;
  text-underline-offset: 3px;
  margin-bottom: 0.15rem;
}

.media-group {
  background: none;
  border: none;
  padding: 0;

  font: inherit;
  color: var(--accent-color);

  cursor: pointer;
  text-align: left;
  display: block;
}

/* label reacts */
.media-group:hover .media-label {
  opacity: 1;
}

/* image reacts */
.media-group:hover img {
  filter: brightness(0.85);
}

/* play icon appears */
.media-group:hover .thumb-wrap::after {
  opacity: 0.5;
}

.thumb-wrap {
  position: relative;
  display: block;
}

/* play icon */
.thumb-wrap::after {
  content: "▶";
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 2.2rem;
  color: var(--text-color);

  opacity: 0;
  transition: opacity 0.15s ease;
}

/* show on hover */
.youtube-trigger:hover .thumb-wrap::after {
  opacity: 0.6;
}

.youtube-trigger:hover img {
  filter: brightness(0.85);
}

body.modal-open {
  position: fixed;
  width: 100%;
  overscroll-behavior: none;
}

</style>

</head>

<body>

<h1><a href="https://www.neilthornock.org">Neil Thornock</a></h1>

<div class="linediv"></div>

<nav class="secondary-nav">
  <span class="nav-inner">
    <a href="/" class="active-nav">Compositions</a>
    <span class="sep">·</span>
    <a href="/projects/">Projects</a>
    <span class="sep">·</span>
    <a href="/gallery.html">Gallery</a>
    <span class="sep">·</span>
    <a href="/blog/">Blog</a>
    <span class="sep">·</span>
    <a href="/bio.html">Bio</a>
  </span>
</nav>

<div class="filters">
  <span class="nav-inner">
    <button onclick="renderInstrumentation(this)">All</button>
    <span class="sep">·</span>
    <button onclick="renderInstrumentation(this, 'piano')">Piano</button>
    <span class="sep">·</span>
    <button onclick="renderInstrumentation(this, 'organ')">Organ</button>
    <span class="sep">·</span>
    <button onclick="renderInstrumentation(this, 'carillon')">Carillon</button>
    <span class="sep">·</span>
    <button onclick="renderInstrumentation(this, 'other')">Other</button>
  </span>
</div>

<input type="text" id="search" placeholder="Search pieces..." autocomplete="off">

<div class="linediv"></div>

<div id="piece-container">
  <div id="breadcrumbs" class="breadcrumbs"></div>
  <h2 class="piece-title" id="piece-title"></h2>
  <p id="instrumentation" class="meta"></p>
  <ol class="movement-list" id="movements"></ol>
  <p id="description"></p>
  <div id="score-link"></div>
  <div id="media"></div>
</div>

<div class="linediv" id="piece-divider"></div>

<div id="filter-breadcrumbs" class="breadcrumbs"></div>

<ul class="movement-list" id="list"></ul>

<script src="pieces.js"></script>

<script>
window.onerror = console.error;
const otherCategories = [
  "orchestra",
  "microtonal",
  "electronic",
  "chamber"
];
const list = document.getElementById("list");
const search = document.getElementById("search");

const mainInstrumentations = new Set(["piano", "organ", "carillon"]);

function getInstrumentationValues(piece) {
  if (!piece.instrumentation) return [];
  return Array.isArray(piece.instrumentation)
    ? piece.instrumentation
    : [piece.instrumentation];
}

function getInstrumentationLabel(piece) {
  return getInstrumentationValues(piece).join(", ");
}

function matchesInstrumentationFilter(piece, selected) {
  if (!selected) return true;

  const values = getInstrumentationValues(piece).map(v => v.toLowerCase());

  if (selected === "other") {
    return values.length > 0 && values.some(v => !mainInstrumentations.has(v));
  }

  return values.includes(selected);
}

let currentIndex = -1;
let currentItems = [];

function setSearchWidth() {
  const nav = document.querySelector(".secondary-nav .nav-inner");
  const filters = document.querySelector(".filters .nav-inner");
  const search = document.getElementById("search");

  if (!nav || !filters || !search) return;

  const width = filters.getBoundingClientRect().width;
  const finalWidth = Math.ceil(width + 4);

  search.style.width = `${finalWidth}px`;
  
  // also apply to media preview
  const preview = document.querySelector(".media-preview");
  if (preview) {
    preview.style.width = `${finalWidth}px`;
  }
}

function slugify(str) {
  return str.toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^\w\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-");
}

function renderPieceBreadcrumbs() {
  const crumbs = document.getElementById("breadcrumbs");
  const params = new URLSearchParams(window.location.search);
  const pieceKey = params.get("piece");

  crumbs.innerHTML = "";

  if (!pieceKey) return;

  const p = pieces[pieceKey];
  if (!p) return;

  const parts = [];

  if (p.project) {
    const slug = slugify(p.project);
    parts.push(`<a href="/projects/${slug}.html">${p.project}</a>`);
  }

  parts.push(p.title);

  crumbs.innerHTML = parts.join('<span class="sep">·</span>');
}

function renderFilterBreadcrumbs() {
  const crumbs = document.getElementById("filter-breadcrumbs");
  const params = new URLSearchParams(window.location.search);

  const instrumentation = params.get("instrumentation");
  const project = params.get("project");
  const searchVal = params.get("search");

  crumbs.innerHTML = "";

  const parts = [];

  if (instrumentation) {
    const next = new URLSearchParams(params);
    next.delete("instrumentation");
    parts.push(`
      <a href="?${next.toString()}" data-remove="instrumentation">
        ${instrumentation.replace(/\b\w/g, c => c.toUpperCase())}
      </a>
    `);
  }

  if (project) {
    const next = new URLSearchParams(params);
    next.delete("project");
    parts.push(`
      <a href="?${next.toString()}" data-remove="project">
        ${project.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase())}
      </a>
    `);
  }

  if (searchVal) {
    const next = new URLSearchParams(params);
    next.delete("search");
    parts.push(`
      <a href="?${next.toString()}" data-remove="search">
        Search: ${searchVal}
      </a>
    `);
  }

  if (parts.length) {
    const next = new URLSearchParams(params);
    next.delete("instrumentation");
    next.delete("project");
    next.delete("search");
    next.delete("piece");

    parts.push(`<a href="?${next.toString()}" id="clear-filter">clear</a>`);
    crumbs.innerHTML = parts.join('<span class="sep">·</span>');
  }
}

function syncUI() {
  renderPieceBreadcrumbs();
  renderFilterBreadcrumbs();
  updateActiveFilter();
}

function clearPiece() {
  const divider = document.getElementById("piece-divider");

  document.getElementById("breadcrumbs").innerHTML = "";
  document.getElementById("piece-title").textContent = "";
  document.getElementById("instrumentation").textContent = "";
  document.getElementById("movements").innerHTML = "";
  document.getElementById("description").textContent = "";
  document.getElementById("score-link").innerHTML = "";
  document.getElementById("media").innerHTML = "";

  if (divider) divider.style.display = "none";

  const params = new URLSearchParams(window.location.search);
  params.delete("piece");

  const modal = document.getElementById("youtube-modal");
  if (modal && modal.classList.contains("open")) {
    modal.classList.remove("open");
  
    const frame = modal.querySelector(".yt-frame");
    if (frame) frame.innerHTML = "";
  }
}

function updateActiveFilter() {
  const params = new URLSearchParams(window.location.search);

  const instrumentation = params.get("instrumentation");
  const project = params.get("project");
  const searchVal = params.get("search");

  const buttons = document.querySelectorAll(".filters button");
  buttons.forEach(b => b.classList.remove("active-filter"));

  if (!instrumentation && !project && !searchVal) {
    const allBtn = document.querySelector('.filters button[onclick="renderInstrumentation(this)"]');
    if (allBtn) allBtn.classList.add("active-filter");
    return;
  }

  if (instrumentation) {
    const btn = document.querySelector(`.filters button[onclick*="${instrumentation}"]`);
    if (btn) btn.classList.add("active-filter");
  }
}

function render(instrumentation = "", filter = "") {
  list.innerHTML = "";
  currentItems = [];

  const params = new URLSearchParams(window.location.search);
  const projectParam = params.get("project");
  const instParam = params.get("instrumentation");

  Object.entries(pieces)
    .filter(([_, p]) => {
      const matchesInstrumentation = matchesInstrumentationFilter(p, instrumentation);

      const matchesSearch =
        p.title.toLowerCase().includes(filter.toLowerCase()) ||
        (p.movements && p.movements.some(m => m.toLowerCase().includes(filter.toLowerCase())));

      let matchesProject = true;
      if (projectParam) {
        matchesProject = p.project && slugify(p.project) === projectParam;
      }

      let matchesInst = true;
      if (instParam) {
        matchesInst = matchesInstrumentationFilter(p, instParam);
      }

      return matchesInstrumentation && matchesSearch && matchesProject && matchesInst;
    })
    .sort((a, b) => a[1].title.localeCompare(b[1].title))
    .forEach(([key, p]) => {
      const li = document.createElement("li");
      const a = document.createElement("a");

      const params = new URLSearchParams(window.location.search);
      params.set("piece", key);
      a.href = "?" + params.toString();

      const query = filter.toLowerCase();

      let titleMatches = p.title.toLowerCase().includes(query);
      let matchedMovement = null;

      if (!titleMatches && p.movements) {
        matchedMovement = p.movements.find(m =>
          m.toLowerCase().includes(query)
        );
      }

      if (filter && titleMatches) {
        const regex = new RegExp(`(${filter})`, "gi");
        a.innerHTML = p.title.replace(regex, "<mark>$1</mark>");
      } else if (matchedMovement) {
        a.innerHTML = `${p.title} <span class="movement-match">(${matchedMovement})</span>`;
      } else {
        a.textContent = p.title;
      }

      li.appendChild(a);
      list.appendChild(li);
      currentItems.push(a);
    });

  if (list.children.length === 0) {
    const empty = document.createElement("p");
    empty.id = "no-results";
    empty.textContent = "No pieces found.";
    list.appendChild(empty);
  }

  currentIndex = -1;
}

function renderInstrumentation(button, instrumentation) {
  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active-filter"));

  button.classList.add("active-filter");

  const params = new URLSearchParams(window.location.search);
  if (instrumentation) params.set("instrumentation", instrumentation);
  else params.delete("instrumentation");

  history.pushState(null, "", "?" + params.toString());

  clearPiece();
  renderAll();
}

function renderAll() {
  const params = new URLSearchParams(window.location.search);

  const instrumentation = params.get("instrumentation");
  const searchVal = params.get("search") || "";
  const pieceKey = params.get("piece");

  render(instrumentation, searchVal);
  renderPiece(pieceKey);
  syncUI();
}

function renderPiece(pieceKey) {
  const p = pieces[pieceKey];
  const divider = document.getElementById("piece-divider");

  if (!p) {
    divider.style.display = "none";
    return;
  }

  divider.style.display = "block";

  document.getElementById("piece-title").textContent = p.title;
  document.title = p.title;

  const inst = document.getElementById("instrumentation");
  const instLabel = getInstrumentationLabel(p);
  
  if (instLabel) {
    const instValues = getInstrumentationValues(p).map(v => v.toLowerCase());
  
    if (instValues.length === 1) {
      inst.innerHTML = `
        <a href="/?instrumentation=${instValues[0]}" class="instrument-link">
          ${instLabel}
        </a>
      `;
    } else {
      inst.textContent = instLabel;
    }
  } else {
    inst.innerHTML = "";
  }

  const ol = document.getElementById("movements");
  ol.innerHTML = "";

  if (p.movements) {
    p.movements.forEach(m => {
      const li = document.createElement("li");
      li.textContent = m;
      ol.appendChild(li);
    });
  }

  if (!p.movements && p.movementInfo) {
    const li = document.createElement("li");
    li.textContent = p.movementInfo;
    li.classList.add("movement-meta");
    ol.appendChild(li);
  }

  document.getElementById("description").textContent = p.description || "";

  if (p.project) {
    const slug = slugify(p.project);
    document.getElementById("description").innerHTML += `
      <p><em>Part of <a href="/projects/${slug}.html">${p.project}</a></em></p>
    `;
  }

  document.getElementById("score-link").innerHTML = p.score
    ? `<a href="${p.score}" target="_blank">PDF Score</a>`
    : "";

  const media = document.getElementById("media");
  media.innerHTML = "";

  if (p.youtube) {
    const id = p.youtube.split("v=")[1]?.split("&")[0];
    const thumb = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

    media.innerHTML = `
      <div class="media-preview">
        <button type="button" class="youtube-trigger media-group" data-id="${id}">
          <span class="media-label">Recording</span>
          <span class="thumb-wrap">
            <img src="${thumb}" alt="Video preview">
          </span>
        </button>
      </div>
    `;
  }
}

search.addEventListener("input", () => {

  const value = search.value;

  const params = new URLSearchParams(window.location.search);

  if (value) {
    params.set("search", value);
  } else {
    params.delete("search");
  }

  history.pushState(
    null,
    "",
    params.toString() ? "?" + params.toString() : location.pathname
  );

  const currentCategory = params.get("category");

  renderAll();
});

// init
const params = new URLSearchParams(window.location.search);
const initialSearch = params.get("search") || "";
const initialCategory = params.get("category");

search.value = initialSearch;

renderAll();

search.focus();

window.addEventListener("load", setSearchWidth);
setTimeout(setSearchWidth, 50);
window.addEventListener("resize", setSearchWidth);

document.addEventListener("click", (e) => {
  if (e.target && e.target.id === "clear-filter") {
    e.preventDefault();

    const params = new URLSearchParams(window.location.search);

    params.delete("project");
    params.delete("instrumentation");
    params.delete("search");

    history.pushState(
      null,
      "",
      params.toString() ? "?" + params.toString() : location.pathname
    );

    renderAll();
  }
});
  document.addEventListener("click", (e) => {
  const trigger = e.target.closest(".youtube-trigger");

  if (trigger) {
    const id = trigger.dataset.id;

    const modal = document.getElementById("youtube-modal");
    const frame = modal.querySelector(".yt-frame");

    frame.innerHTML = `
      <iframe
        src="https://www.youtube.com/embed/${id}?autoplay=1"
        allow="autoplay"
        allowfullscreen
      ></iframe>
    `;

    modal.classList.add("open");
    lockScroll();
  }

  if (e.target.id === "yt-close" || e.target.id === "youtube-modal") {
    const modal = document.getElementById("youtube-modal");
    const frame = modal.querySelector(".yt-frame");

    modal.classList.remove("open");
    document.body.classList.remove("modal-open");
    frame.innerHTML = "";
    unlockScroll();
  }
});
  document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const modal = document.getElementById("youtube-modal");

    if (modal.classList.contains("open")) {
      modal.classList.remove("open");
      document.body.classList.remove("modal-open");

      const frame = modal.querySelector(".yt-frame");
      frame.innerHTML = ""; // stop video
      unlockScroll();
    }
  }
});
document.addEventListener("click", (e) => {
  const link = e.target.closest("a");

  if (!link) return;

  const url = new URL(link.href, window.location.origin);

  // only handle same-origin links with query params (your SPA links)
  if (url.search.includes("piece=")) {
    e.preventDefault();

    history.pushState(null, "", url.search);
    renderAll();
    window.scrollTo(0, 0);
  }
});
const modalInner = document.querySelector(".yt-modal-inner");
if (modalInner) {
  modalInner.addEventListener("click", (e) => {
    e.stopPropagation();
  });
}

let scrollY = 0;

function lockScroll() {
  scrollY = window.scrollY;
  document.body.classList.add("modal-open");
  document.body.style.top = `-${scrollY}px`;
}

function unlockScroll() {
  document.body.classList.remove("modal-open");
  document.body.style.top = "";
  window.scrollTo(0, scrollY);
}

  window.addEventListener("popstate", () => {
    renderAll();
  });
  
</script>

<div class="linediv"></div>

<p class="footer">
  <a href="https://www.youtube.com/@neilthornock" target="_blank" class="external">YouTube</a>
  <span class="sep">·</span>
  <a href="mailto:neilthornock@gmail.com" class="external">Email</a>
</p>

<div id="youtube-modal" class="yt-modal">
  <div class="yt-modal-inner">
    <button id="yt-close">×</button>
    <div class="yt-frame"></div>
  </div>
</div>
  
</body>
</html>
