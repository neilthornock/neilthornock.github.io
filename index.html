<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<title>Neil Thornock</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<link href="/main.css" rel="stylesheet">

<style>
.landing-image-slot {
  min-height: 18rem;
  display: flex;
  align-items: center;
}

.landing-image-slot .nav-inner {
  display: block;
  margin: 0 auto; /* centers to same width as nav text */
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(2, 84px);
  gap: 1rem;
  justify-content: center;
  transform: translateX(10px) translateY(-4px);
}

.sound-btn {
  width: 84px;
  height: 84px;
  padding: 0;
  border: none;
  background-color: var(--accent-color);
  opacity: 0.28;
  cursor: pointer;

  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;

  --hover-scale: 1.03;
  --pluck-depth: 0.96;
  --pluck-duration: 180ms;
  --fade-duration: 1.9s;

  transition:
    opacity var(--fade-duration) ease-out,
    filter var(--fade-duration) ease-out,
    transform 120ms ease;
}

.sound-btn:hover {
  transform: scale(var(--hover-scale));
}

.sound-btn.active {
  opacity: 1;
  filter:
    brightness(1.8)
    saturate(1.4)
    drop-shadow(0 0 0.45rem var(--accent-color))
    drop-shadow(0 0 1.1rem rgba(102, 205, 170, 0.45));
  animation: pluck var(--pluck-duration) ease-out;
}

@keyframes pluck {
  0%   { transform: scale(var(--hover-scale)); }
  45%  { transform: scale(var(--pluck-depth)); }
  100% { transform: scale(var(--hover-scale)); }
}

.sound-btn[data-icon="eyesquare"] {
  -webkit-mask-image: url('/images/eyesquare.svg');
  mask-image: url('/images/eyesquare.svg');
}

.sound-btn[data-icon="jailsquare"] {
  -webkit-mask-image: url('/images/jailsquare.svg');
  mask-image: url('/images/jailsquare.svg');
}

.sound-btn[data-icon="playline"] {
  -webkit-mask-image: url('/images/playline.svg');
  mask-image: url('/images/playline.svg');
}

.sound-btn[data-icon="squigglecircle"] {
  -webkit-mask-image: url('/images/squigglecircle.svg');
  mask-image: url('/images/squigglecircle.svg');
}
</style>
</head>

<body>

<h1><a href="/">Neil Thornock</a></h1>

<div class="linediv"></div>

<nav class="secondary-nav">
  <span class="nav-inner">
    <a href="/compositions/">Compositions</a>
    <span class="sep">·</span>
    <a href="/projects/">Projects</a>
    <span class="sep">·</span>
    <a href="/gallery/">Gallery</a>
    <span class="sep">·</span>
    <a href="/blog/">Blog</a>
    <span class="sep">·</span>
    <a href="/bio/">Bio</a>
  </span>
</nav>

<div class="landing-image-slot">
  <span class="nav-inner">
  <div class="button-grid" aria-label="sound buttons">
    <button class="sound-btn" data-icon="eyesquare" aria-label="sound 1"></button>
    <button class="sound-btn" data-icon="squigglecircle" aria-label="sound 2"></button>
    <button class="sound-btn" data-icon="playline" aria-label="sound 3"></button>
    <button class="sound-btn" data-icon="jailsquare" aria-label="sound 4"></button>
  </div>
  <span class="nav-inner">
</div>

<div class="linediv"></div>

<p class="footer">
  <a href="https://www.youtube.com/@neilthornock" target="_blank" class="external">YouTube</a>
  <span class="sep">·</span>
  <a href="mailto:neilthornock@gmail.com" class="external">Email</a>
</p>

<script>


let keyboardArmed = false;

const grid = document.querySelector(".button-grid");

grid.addEventListener("pointerenter", () => {
  keyboardArmed = true;
});

grid.addEventListener("pointerleave", () => {
  keyboardArmed = false;
});
  
const buttons = document.querySelectorAll(".sound-btn");

/* ---------- visual click behavior ---------- */
async function activateButton(btn, index) {
  const depth = 0.94 + Math.random() * 0.03;
  const pluckDuration = 140 + Math.random() * 60;
  const fadeDuration = 0.7 + Math.random() * 0.4;
  const releaseDelay = 80 + Math.random() * 80;

  btn.style.setProperty("--pluck-depth", depth.toFixed(3));
  btn.style.setProperty("--pluck-duration", pluckDuration + "ms");
  btn.style.setProperty("--fade-duration", fadeDuration + "s");

  await ensureAudio();

  btn.classList.add("active");
  playNote(index);

  setTimeout(() => {
    btn.classList.remove("active");
  }, releaseDelay);
}

/* mouse / touch */
buttons.forEach((btn, index) => {
  btn.addEventListener("pointerdown", () => activateButton(btn, index));
});

/* keyboard */
const keyMap = {
  "1": 0,
  "2": 1,
  "3": 2,
  "4": 3,
  q: 0,
  w: 1,
  e: 2,
  r: 3
};

window.addEventListener("keydown", (event) => {
  if (!keyboardArmed) return;
  if (event.repeat) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  const tag = event.target?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || event.target?.isContentEditable) return;

  const key = event.key.toLowerCase();
  const index = keyMap[key];
  if (index === undefined) return;

  event.preventDefault();
  activateButton(buttons[index], index);
});

/* ---------- Web Audio ---------- */
let audioCtx = null;
let master = null;
let chordTimer = null;
let currentPitches = [];
let audioStarted = false;

const baseHz = 98.0;

const pitchRatios = [
  1 / 1,
  9 / 8,
  10 / 8,
  11 / 8,
  12 / 8,
  13 / 8,
  14 / 8,
  15 / 8,
  16 / 8,
  18 / 8,
  20 / 8,
  22 / 8,
  24 / 8,
  26 / 8,
  28 / 8,
  30 / 8,
  32 / 8,
  36 / 8
];

function buildPitchPool() {
  return pitchRatios.map((ratio) => baseHz * ratio);
}

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function assignPitches() {
  const pool = shuffle(buildPitchPool());
  currentPitches = pool.slice(0, 4);
}

async function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    master = audioCtx.createGain();
    master.gain.value = 0.7;

    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -24;
    comp.knee.value = 18;
    comp.ratio.value = 4;
    comp.attack.value = 0.01;
    comp.release.value = 0.15;

    master.connect(comp);
    comp.connect(audioCtx.destination);
  }

  if (audioCtx.state === "suspended") {
    await audioCtx.resume();
  }

  if (!audioStarted) {
    assignPitches();
    scheduleNextChordChange();
    audioStarted = true;
  }
}

function playNote(index) {
  const ctx = audioCtx;
  const t0 = ctx.currentTime;
  const freq = currentPitches[index % currentPitches.length];

  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(freq * 9, t0);
  filter.Q.value = 0.8;

  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0.0001, t0);
  amp.gain.exponentialRampToValueAtTime(Math.random() * 0.6 + 0.3, t0 + 0.01);

  const decay = 2.5 + Math.random() * 0.8;
  amp.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);

  const osc1 = ctx.createOscillator();
  osc1.type = "triangle";
  osc1.frequency.setValueAtTime(freq, t0);

  const osc2 = ctx.createOscillator();
  osc2.type = "sine";
  osc2.frequency.setValueAtTime(freq * 2, t0);
  osc2.detune.setValueAtTime(4 + Math.random() * 5, t0);

  const osc3 = ctx.createOscillator();
  osc3.type = "sine";
  osc3.frequency.setValueAtTime(freq * 0.5, t0);

  const partial = ctx.createGain();
  partial.gain.value = 0.18;

  osc1.connect(filter);
  osc2.connect(filter);
  osc3.connect(partial);
  partial.connect(filter);
  filter.connect(amp);
  amp.connect(master);

  osc1.start(t0);
  osc2.start(t0);
  osc3.start(t0);

  osc1.stop(t0 + decay + 0.2);
  osc2.stop(t0 + decay + 0.2);
  osc3.stop(t0 + decay + 0.2);
}

function scheduleNextChordChange() {
  clearTimeout(chordTimer);

  const delay = 5000 + Math.random() * 5000;
  chordTimer = setTimeout(() => {
    assignPitches();
    scheduleNextChordChange();
  }, delay);
}

window.addEventListener("keydown", (event) => {
  if (event.repeat) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  if (!keyboardArmed) return;

  const tag = event.target?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || event.target?.isContentEditable) return;

  const key = event.key.toLowerCase();
  const index = keyMap[key];
  if (index === undefined) return;

  event.preventDefault();
  activateButton(buttons[index], index);
});
</script>

</body>
</html>
