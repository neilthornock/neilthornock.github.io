<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<title>Neil Thornock</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<link href="/main.css" rel="stylesheet">

<style>
.landing-image-slot {
  min-height: 18rem;

  display: flex;
  align-items: center;     /* vertical centering */
  transform: translateX(10px) translateY(-4px);
  justify-content: center; /* horizontal centering within nav width */

  margin-top: 0; /* remove previous manual offset */
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(2, 84px);
  gap: 1rem;
  justify-content: center;
}

.sound-btn {
  width: 84px;
  height: 84px;
  padding: 0;
  border: none;
  background-color: var(--accent-color);

  opacity: 0.55; /* quieter baseline */
  cursor: pointer;

  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;

  /* slow fade OUT only */
  transition: opacity 0.8s ease-out, filter 0.8s ease-out;
}

.sound-btn:hover {
  opacity: 0.55;
  transition: opacity 0.8s ease-out, filter 0.8s ease-out, transform 0.18s ease;
  transform: scale(1.02);
}

.sound-btn.active {
  opacity: 1;
  filter: drop-shadow(0 0 8px var(--accent-color));
}

.sound-btn[data-icon="eyesquare"] {
  -webkit-mask-image: url('/images/eyesquare.svg');
  mask-image: url('/images/eyesquare.svg');
}

.sound-btn[data-icon="jailsquare"] {
  -webkit-mask-image: url('/images/jailsquare.svg');
  mask-image: url('/images/jailsquare.svg');
}

.sound-btn[data-icon="playline"] {
  -webkit-mask-image: url('/images/playline.svg');
  mask-image: url('/images/playline.svg');
}

.sound-btn[data-icon="squigglecircle"] {
  -webkit-mask-image: url('/images/squigglecircle.svg');
  mask-image: url('/images/squigglecircle.svg');
}
</style>
</head>

<body>

<h1><a href="/">Neil Thornock</a></h1>

<div class="linediv"></div>

<nav class="secondary-nav">
  <span class="nav-inner">
    <a href="/compositions/">Compositions</a>
    <span class="sep">·</span>
    <a href="/projects/">Projects</a>
    <span class="sep">·</span>
    <a href="/gallery/">Gallery</a>
    <span class="sep">·</span>
    <a href="/blog/">Blog</a>
    <span class="sep">·</span>
    <a href="/bio/">Bio</a>
  </span>
</nav>

<div class="landing-image-slot">
  <div class="button-grid" aria-label="sound buttons">
    <button class="sound-btn" data-icon="eyesquare" aria-label="sound 1"></button>
    <button class="sound-btn" data-icon="squigglecircle" aria-label="sound 2"></button>
    <button class="sound-btn" data-icon="playline" aria-label="sound 3"></button>
    <button class="sound-btn" data-icon="jailsquare" aria-label="sound 4"></button>
  </div>
</div>

<div class="linediv"></div>

<p class="footer">
  <a href="https://www.youtube.com/@neilthornock" target="_blank" class="external">YouTube</a>
  <span class="sep">·</span>
  <a href="mailto:neilthornock@gmail.com" class="external">Email</a>
</p>

<script>
const buttons = document.querySelectorAll(".sound-btn");

buttons.forEach((btn) => {
  btn.addEventListener("pointerdown", () => {
    // instant attack
    btn.style.transitionDuration = "0s";
    btn.classList.add("active");

    // next frame → enable slow decay
    requestAnimationFrame(() => {
      btn.style.transitionDuration = (0.7 + Math.random() * 0.4) + "s";
    });

    // trigger release
    setTimeout(() => {
      btn.classList.remove("active");
    }, 80 + Math.random() * 80);
  });
});

function syncLandingWidth() {
  const navInner = document.querySelector(".secondary-nav .nav-inner");
  const slot = document.querySelector(".landing-image-slot");
  if (!navInner || !slot) return;

  slot.style.width = navInner.offsetWidth + "px";
}

window.addEventListener("load", syncLandingWidth);
window.addEventListener("resize", syncLandingWidth);
document.fonts?.ready?.then(syncLandingWidth);
</script>

</body>
</html>
