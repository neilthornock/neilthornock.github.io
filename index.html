<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<title>Neil Thornock</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<link href="/main.css" rel="stylesheet">

<style>
.landing-image-slot {
  min-height: 18rem;
}

/* =========================
Landing sound grid
========================= */

.landing-image-slot {
  min-height: 18rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(2, 80px);
  grid-gap: 1.2rem;
}

/* base button */
.sound-btn {
  width: 80px;
  height: 80px;
  background-color: rgba(255,255,255,0.15);
  border: none;
  cursor: pointer;
  padding: 0;

  /* mask (icon shape) */
  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;

  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;

  transition: background-color 0.2s ease, opacity 0.3s ease;
  opacity: 0.7;
}

.sound-btn:hover {
  opacity: 1;
}

/* assign your icons */
.sound-btn:nth-child(1) {
  -webkit-mask-image: url('/images/eyesquare.png');
  mask-image: url('/images/eyesquare.png');
}

.sound-btn:nth-child(2) {
  -webkit-mask-image: url('/images/jailsquare.png');
  mask-image: url('/images/jailsquare.png');
}

.sound-btn:nth-child(3) {
  -webkit-mask-image: url('/images/play-line.png');
  mask-image: url('/images/play-line.png');
}

.sound-btn:nth-child(4) {
  -webkit-mask-image: url('/images/squigglecircle.png');
  mask-image: url('/images/squigglecircle.png');
}

/* active (lit) state */
.sound-btn.active {
  background-color: var(--accent-color);
  opacity: 1;
}
</style>
</head>

<body>

<h1><a href="/">Neil Thornock</a></h1>

<div class="linediv"></div>

<nav class="secondary-nav">
  <span class="nav-inner">
    <a href="/compositions/">Compositions</a>
    <span class="sep">·</span>
    <a href="/projects/">Projects</a>
    <span class="sep">·</span>
    <a href="/gallery/">Gallery</a>
    <span class="sep">·</span>
    <a href="/blog/">Blog</a>
    <span class="sep">·</span>
    <a href="/bio/">Bio</a>
  </span>
</nav>

<div class="landing-image-slot">
  <div class="button-grid">
    <button class="sound-btn" data-note="0"></button>
    <button class="sound-btn" data-note="1"></button>
    <button class="sound-btn" data-note="2"></button>
    <button class="sound-btn" data-note="3"></button>
  </div>
</div>

<div class="linediv"></div>

<p class="footer">
  <a href="https://www.youtube.com/@neilthornock" target="_blank" class="external">YouTube</a>
  <span class="sep">·</span>
  <a href="mailto:neilthornock@gmail.com" class="external">Email</a>
</p>

<script>
const buttons = document.querySelectorAll('.sound-btn');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    triggerVisual(btn);
  });
});

function triggerVisual(btn) {
  btn.classList.add('active');

  // fade out (matches future sound envelope)
  setTimeout(() => {
    btn.classList.remove('active');
  }, 600);
}

/* placeholder chord cycling (for later audio mapping) */
let chordIndex = 0;
setInterval(() => {
  chordIndex = (chordIndex + 1) % 4;
  // later: update pitch mapping here
}, 4000);
</script>

</body>
</html>
