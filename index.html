<!doctype html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compositions</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<link href="main.css" rel="stylesheet">

<style>
#piece-divider {
  display: none;
}
#search {
  width: 60%;
  max-width: 320px;

  padding: 2px 0;
  margin-bottom: 0.8rem;

  font-family: inherit;
  font-size: 1rem;

  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.3);

  color: var(--text-color);
}

#search:focus {
  outline: none;
  border-bottom-color: var(--accent-color);
}

.filters {
  font-style: italic;
  color: rgba(255,255,255,0.6);
}

.filters button {
  background: none;
  border: none;
  padding: 0;

  font: inherit;
  font-style: inherit;
  color: var(--accent-color);

  cursor: pointer;
}

/* separators */
.filters .sep {
  margin: 0 0.4rem;
  color: rgba(255,255,255,0.4);
}

/* unified underline behavior */
.filters button:hover,
.filters button.active-filter {
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* active = slightly stronger presence */
.filters button.active-filter {
  color: var(--text-color);
}
</style>

</head>

<body>

<h1><a href="https://www.neilthornock.org">Neil Thornock</a></h1>

<div class="linediv"></div>
<h2>Compositions</h2>

<!-- Filters -->

<div class="filters">
  <button onclick="renderCategory(this)">All</button>
  <span class="sep">·</span>
  <button onclick="renderCategory(this, 'carillon')">Carillon</button>
  <span class="sep">·</span>
  <button onclick="renderCategory(this, 'piano')">Piano</button>
  <span class="sep">·</span>
  <button onclick="renderCategory(this, 'organ')">Organ</button>
  <span class="sep">·</span>
  <button onclick="renderCategory(this, 'other')">Other</button>
</div>

<input type="text" id="search" placeholder="Search pieces..." autocomplete="off">
  
<div class="linediv"></div>

<!-- Piece display -->

<h2 class="piece-title" id="piece-title"></h2>
<ol class="movement-list" id="movements"></ol>
<p id="description"></p>
<div id="score-link"></div>

<div class="linediv" id="piece-divider"></div>

<!-- List -->

<ul class="movement-list" id="list"></ul>

<script src="pieces.js"></script>

<script>
const list = document.getElementById("list");
const search = document.getElementById("search");

let currentIndex = -1;
let currentItems = [];

function clearPiece() {
  document.getElementById("piece-title").textContent = "";
  document.getElementById("movements").innerHTML = "";
  document.getElementById("description").textContent = "";
  document.getElementById("score-link").innerHTML = "";

  const divider = document.getElementById("piece-divider");
  if (divider) divider.style.display = "none";

  // remove piece from URL but keep category/search
  const params = new URLSearchParams(window.location.search);
  params.delete("piece");

  history.replaceState(
    null,
    "",
    params.toString() ? "?" + params.toString() : location.pathname
  );
}

function renderCategory(button, category) {
  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active-filter"));

  button.classList.add("active-filter");

  // update URL
  const params = new URLSearchParams(window.location.search);

  if (category) {
    params.set("category", category);
  } else {
    params.delete("category");
  }

  history.replaceState(null, "", "?" + params.toString());

  clearPiece(); // ✅ THIS is the key line

  render(category, search.value);
}

function render(category, filter = "") {
  list.innerHTML = "";
  currentItems = [];

  Object.entries(pieces)
    .filter(([_, p]) =>
      (!category || p.category === category) &&
      p.title.toLowerCase().includes(filter.toLowerCase())
    )
    .sort((a, b) => a[1].title.localeCompare(b[1].title))
    .forEach(([key, p]) => {

      const li = document.createElement("li");
      const a = document.createElement("a");

      const params = new URLSearchParams(window.location.search);
      const currentCategory = params.get("category");
      
      a.href = `?piece=${key}` + (currentCategory ? `&category=${currentCategory}` : "");

      // highlight match
      if (filter) {
        const regex = new RegExp(`(${filter})`, "gi");
        a.innerHTML = p.title.replace(regex, "<mark>$1</mark>");
      } else {
        a.textContent = p.title;
      }

      li.appendChild(a);
      list.appendChild(li);

      currentItems.push(a);
    });

  currentIndex = -1;
}

// keyboard navigation
search.addEventListener("keydown", (e) => {

  if (e.key === "Escape") {
    e.preventDefault();

    search.value = "";

    const params = new URLSearchParams(window.location.search);
    params.delete("search");

    history.replaceState(null, "", params.toString() ? "?" + params.toString() : location.pathname);

    render();
    currentIndex = -1;

    search.focus(); // keep cursor ready
  }

  if (e.key === "ArrowDown") {
    e.preventDefault();
    currentIndex = Math.min(currentIndex + 1, currentItems.length - 1);
    updateActive();
  }

  if (e.key === "ArrowUp") {
    e.preventDefault();
    currentIndex = Math.max(currentIndex - 1, 0);
    updateActive();
  }

  if (e.key === "Enter" && currentItems[currentIndex]) {
    window.location = currentItems[currentIndex].href;
  }
});

function updateActive() {
  currentItems.forEach(a => a.classList.remove("active"));
  if (currentItems[currentIndex]) {
    currentItems[currentIndex].classList.add("active");
    currentItems[currentIndex].scrollIntoView({ block: "nearest" });
  }
}

// live search
search.addEventListener("input", () => {
  clearPiece();
  const value = search.value;

  // update URL without reloading
  const params = new URLSearchParams(window.location.search);
  if (value) {
    params.set("search", value);
  } else {
    params.delete("search");
  }

  history.replaceState(null, "", "?" + params.toString());

  render(undefined, value);
});

// display selected piece
function loadPiece() {
  const params = new URLSearchParams(window.location.search);
  const key = params.get("piece");
  const p = pieces[key];

 const divider = document.getElementById("piece-divider");

if (!p) {
  divider.style.display = "none";
  return;
}

divider.style.display = "block";

  const titleEl = document.getElementById("piece-title");

  titleEl.textContent = p.title;
  document.title = p.title;

  const ol = document.getElementById("movements");
  ol.innerHTML = "";

  if (p.movements) {
    p.movements.forEach(m => {
      const li = document.createElement("li");
      li.textContent = m;
      ol.appendChild(li);
    });
  }

  document.getElementById("description").textContent = p.description || "";

  const scoreDiv = document.getElementById("score-link");
  scoreDiv.innerHTML = p.score
    ? `<a href="${p.score}" target="_blank">PDF Score</a>`
    : "";

}

// init
const params = new URLSearchParams(window.location.search);

const initialSearch = params.get("search") || "";
search.value = initialSearch;

const initialCategory = params.get("category");

render(initialCategory, initialSearch);
if (initialCategory) {
  const btn = document.querySelector(`.filters button[onclick*="${initialCategory}"]`);
  if (btn) btn.classList.add("active-filter");
} else {
  document.querySelector(".filters button").classList.add("active-filter"); // "All"
}
loadPiece();
search.focus();
</script>

</body>
</html>
