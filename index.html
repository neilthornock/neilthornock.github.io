<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<script src="https://unpkg.com/tone"></script>

<title>Neil Thornock</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<link href="/main.css" rel="stylesheet">

<style>
.landing-image-slot {
  min-height: 18rem;
  display: flex;
  align-items: center;
  margin-top: 0;
}

.landing-grid-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  transform: translateX(10px) translateY(-4px);
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(2, 84px);
  gap: 1rem;
}

.sound-btn {
  width: 84px;
  height: 84px;
  padding: 0;
  border: none;
  background-color: var(--accent-color);
  opacity: 0.6;
  cursor: pointer;

  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;

  --hover-scale: 1.03;
  --pluck-depth: 0.96;
  --pluck-duration: 180ms;
  --fade-duration: 1.9s;

  transition:
    opacity var(--fade-duration) ease-out,
    filter var(--fade-duration) ease-out,
    transform 120ms ease;
}

.sound-btn:hover {
  transform: scale(var(--hover-scale));
}

.sound-btn.active {
  opacity: 1;
  filter:
    brightness(2.8)
    saturate(2.4)
    drop-shadow(0 0 0.45rem var(--accent-color))
    drop-shadow(0 0 1.1rem rgba(102, 205, 170, 0.45));
  animation: pluck var(--pluck-duration) ease-out;
}

@keyframes pluck {
  0%   { transform: scale(var(--hover-scale)); }
  45%  { transform: scale(var(--pluck-depth)); }
  100% { transform: scale(var(--hover-scale)); }
}

.sound-btn[data-icon="eyesquare"] {
  -webkit-mask-image: url('/images/eyesquare.svg');
  mask-image: url('/images/eyesquare.svg');
}

.sound-btn[data-icon="jailsquare"] {
  -webkit-mask-image: url('/images/jailsquare.svg');
  mask-image: url('/images/jailsquare.svg');
}

.sound-btn[data-icon="playline"] {
  -webkit-mask-image: url('/images/playline.svg');
  mask-image: url('/images/playline.svg');
}

.sound-btn[data-icon="squigglecircle"] {
  -webkit-mask-image: url('/images/squigglecircle.svg');
  mask-image: url('/images/squigglecircle.svg');
}
</style>
</head>

<body>

<h1><a href="/">Neil Thornock</a></h1>

<div class="linediv"></div>

<nav class="secondary-nav">
  <span class="nav-inner">
    <a href="/compositions/">Compositions</a>
    <span class="sep">·</span>
    <a href="/projects/">Projects</a>
    <span class="sep">·</span>
    <a href="/gallery/">Gallery</a>
    <span class="sep">·</span>
    <a href="/blog/">Blog</a>
    <span class="sep">·</span>
    <a href="/bio/">Bio</a>
  </span>
</nav>

<div class="landing-image-slot">
  <div class="landing-grid-wrap">
    <div class="button-grid" aria-label="sound buttons">
      <button class="sound-btn" data-icon="eyesquare" aria-label="sound 1"></button>
      <button class="sound-btn" data-icon="squigglecircle" aria-label="sound 2"></button>
      <button class="sound-btn" data-icon="playline" aria-label="sound 3"></button>
      <button class="sound-btn" data-icon="jailsquare" aria-label="sound 4"></button>
    </div>
  </div>
</div>

<div class="linediv"></div>

<p class="footer">
  <a href="https://www.youtube.com/@neilthornock" target="_blank" class="external">YouTube</a>
  <span class="sep">·</span>
  <a href="mailto:neilthornock@gmail.com" class="external">Email</a>
</p>

<script>
function syncLandingWidth() {
  const navInner = document.querySelector(".secondary-nav .nav-inner");
  const landingWrap = document.querySelector(".landing-grid-wrap");
  if (!navInner || !landingWrap) return;
  landingWrap.style.width = navInner.getBoundingClientRect().width + "px";
}

window.addEventListener("load", syncLandingWidth);
window.addEventListener("resize", syncLandingWidth);
document.fonts?.ready?.then(syncLandingWidth);

let keyboardArmed = false;

const grid = document.querySelector(".button-grid");
grid.addEventListener("pointerenter", () => {
  keyboardArmed = true;
});
grid.addEventListener("pointerleave", () => {
  keyboardArmed = false;
});

const buttons = document.querySelectorAll(".sound-btn");

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---------- Tone.js audio ---------- */
let synth = null;
let chordTimer = null;
let currentPitches = [];
let audioReady = false;
let unlockPromise = null;
let pendingNoteIndex = null;

function ensureSynth() {
  if (!synth) {
    synth = new Tone.Synth({
      oscillator: { type: "triangle" },
      envelope: {
        attack: 0.01,
        decay: 1.8,
        sustain: 0,
        release: 0.15
      }
    }).toDestination();

    synth.volume.value = -10;
  }
}

function buildChord() {
  const rootInt = randomInt(16, 46);
  const stepInt = randomInt(3, 13);

  const rootHz = rootInt * 8;
  const stepHz = stepInt * 8;

  currentPitches = shuffle([
    rootHz,
    rootHz + stepHz,
    rootHz + stepHz * 2,
    rootHz + stepHz * 3
  ]);
}

function setIOSPlaybackSession() {
  if (navigator.audioSession && "type" in navigator.audioSession) {
    try {
      navigator.audioSession.type = "playback";
    } catch (err) {
      console.warn("Could not set audioSession.type:", err);
    }
  }
}

function primeAudio() {
  const primer = new Tone.Synth().toDestination();
  primer.volume.value = -90;
  primer.triggerAttackRelease(500, 1);
  setTimeout(() => primer.dispose(), 1000);
}

async function unlockAudio() {
  if (audioReady) return;
  if (unlockPromise) return unlockPromise;

  unlockPromise = (async () => {
    setIOSPlaybackSession();

    // Start the AudioContext first.
    await Tone.start();

    // Then create and play the primer in the already-started context.
    primeAudio();

    ensureSynth();
    audioReady = true;

    if (!currentPitches.length) {
      buildChord();
      scheduleNextChordChange();
    }

    if (pendingNoteIndex !== null) {
      const index = pendingNoteIndex;
      pendingNoteIndex = null;
      playNote(index);
    }
  })().catch((err) => {
    console.warn("Audio unlock failed:", err);
    audioReady = false;
  }).finally(() => {
    unlockPromise = null;
  });

  return unlockPromise;
}

function playNote(index) {
  if (!currentPitches.length) return;
  ensureSynth();

  const freq = currentPitches[index % currentPitches.length];
  const decay = 2.5 + Math.random() * 0.8;
  synth.triggerAttackRelease(freq, decay);
}

function scheduleNextChordChange() {
  clearTimeout(chordTimer);

  const delay = 5000 + Math.random() * 5000;
  chordTimer = setTimeout(() => {
    buildChord();
    scheduleNextChordChange();
  }, delay);
}

buildChord();
scheduleNextChordChange();

/* ---------- visual click behavior ---------- */
function activateButton(btn, index) {
  const depth = 0.94 + Math.random() * 0.03;
  const pluckDuration = 140 + Math.random() * 60;
  const fadeDuration = 0.7 + Math.random() * 0.4;
  const releaseDelay = 80 + Math.random() * 80;

  btn.style.setProperty("--pluck-depth", depth.toFixed(3));
  btn.style.setProperty("--pluck-duration", pluckDuration + "ms");
  btn.style.setProperty("--fade-duration", fadeDuration + "s");

  btn.classList.add("active");

  if (!audioReady) {
    pendingNoteIndex = index;
    void unlockAudio();
  } else {
    playNote(index);
  }

  setTimeout(() => {
    btn.classList.remove("active");
  }, releaseDelay);
}

/* mouse / touch */
buttons.forEach((btn, index) => {
  btn.addEventListener("pointerdown", () => activateButton(btn, index));
});

/* keyboard */
const keyMap = {
  "1": 0,
  "2": 1,
  "3": 2,
  "4": 3,
  q: 0,
  w: 1,
  e: 2,
  r: 3
};

window.addEventListener("keydown", (event) => {
  if (!keyboardArmed) return;
  if (event.repeat) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;

  const tag = event.target?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || event.target?.isContentEditable) return;

  const key = event.key.toLowerCase();
  const index = keyMap[key];
  if (index === undefined) return;

  event.preventDefault();
  activateButton(buttons[index], index);
});
</script>

</body>
</html>
