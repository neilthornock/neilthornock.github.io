<style>
.landing-image-slot {
  min-height: 18rem;

  display: flex;
  align-items: center;
  justify-content: center;

  transform: translateX(10px) translateY(-4px);
  margin-top: 0;
}

.button-grid {
  display: grid;
  grid-template-columns: repeat(2, 84px);
  gap: 1rem;
  margin-left: 0;
}

.sound-btn {
  width: 84px;
  height: 84px;
  padding: 0;
  border: none;
  background-color: var(--accent-color);
  opacity: 0.4;
  cursor: pointer;

  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;

  --hover-scale: 1.03;
  --pluck-depth: 0.96;
  --pluck-duration: 180ms;
  --fade-duration: 0.9s;

  transition:
    opacity var(--fade-duration) ease-out,
    filter var(--fade-duration) ease-out,
    transform 120ms ease;
}

.sound-btn:hover {
  transform: scale(var(--hover-scale));
}

.sound-btn.active {
  opacity: 1;
  filter:
    brightness(1.25)
    drop-shadow(0 0 10px var(--accent-color));
}

@keyframes pluck {
  0%   { transform: scale(var(--hover-scale)); }
  45%  { transform: scale(var(--pluck-depth)); }
  100% { transform: scale(var(--hover-scale)); }
}

.sound-btn[data-icon="eyesquare"] {
  -webkit-mask-image: url('/images/eyesquare.svg');
  mask-image: url('/images/eyesquare.svg');
}

.sound-btn[data-icon="jailsquare"] {
  -webkit-mask-image: url('/images/jailsquare.svg');
  mask-image: url('/images/jailsquare.svg');
}

.sound-btn[data-icon="playline"] {
  -webkit-mask-image: url('/images/playline.svg');
  mask-image: url('/images/playline.svg');
}

.sound-btn[data-icon="squigglecircle"] {
  -webkit-mask-image: url('/images/squigglecircle.svg');
  mask-image: url('/images/squigglecircle.svg');
}
</style>
</head>

<body>

<h1><a href="/">Neil Thornock</a></h1>

<div class="linediv"></div>

<nav class="secondary-nav">
  <span class="nav-inner">
    <a href="/compositions/">Compositions</a>
    <span class="sep">·</span>

    <span class="sep">·</span>

  </span>

<div class="landing-image-slot">
  <div class="button-grid" aria-label="sound buttons">
    <button class="sound-btn" data-icon="eyesquare" aria-label="sound 1"></button>
    <button class="sound-btn" data-icon="squigglecircle" aria-label="sound 2"></button>
    <button class="sound-btn" data-icon="playline" aria-label="sound 3"></button>
    <button class="sound-btn" data-icon="jailsquare" aria-label="sound 4"></button>
  </div>

<p class="footer">
  <a href="https://www.youtube.com/@neilthornock" target="_blank" class="external">YouTube</a>

  <a href="mailto:neilthornock@gmail.com" class="external">Email</a>
</p>

<script>
const buttons = document.querySelectorAll(".sound-btn");

/* ---------- visual click behavior ---------- */
buttons.forEach((btn, index) => {
  btn.addEventListener("pointerdown", () => {
    const depth = 0.94 + Math.random() * 0.03;       // 0.94–0.97
    const pluckDuration = 140 + Math.random() * 60;  // 140–200ms
    const fadeDuration = 0.7 + Math.random() * 0.4;   // 0.7–1.1s
    const releaseDelay = 80 + Math.random() * 80;    // 80–160ms

    btn.style.setProperty("--pluck-depth", depth.toFixed(3));
    btn.style.setProperty("--pluck-duration", pluckDuration + "ms");
    btn.style.setProperty("--fade-duration", fadeDuration + "s");

    btn.classList.add("active");

    playNote(index);

    setTimeout(() => {
      btn.classList.remove("active");
    }, releaseDelay);
  });
});

/* ---------- Web Audio ---------- */
let audioCtx = null;
let master = null;
let chordTimer = null;
let currentChord = [];
let chordIndex = 0;

/* minor 7 chord roots to cycle through */
const chordRoots = [
  55.00, 61.74, 65.41, 73.42, 82.41, 87.31, 98.00, 110.00
];

/* root, b3, 5, b7 */
function buildChord(rootHz) {
  return [
    rootHz,
    rootHz * Math.pow(2, 3 / 12),
    rootHz * Math.pow(2, 7 / 12),
    rootHz * Math.pow(2, 10 / 12)
  ];
}

function ensureAudio() {
  if (audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  master = audioCtx.createGain();
  master.gain.value = 0.7;

  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -24;
  comp.knee.value = 18;
  comp.ratio.value = 4;
  comp.attack.value = 0.01;
  comp.release.value = 0.15;

  master.connect(comp);
  comp.connect(audioCtx.destination);

  chordIndex = Math.floor(Math.random() * chordRoots.length);
  currentChord = buildChord(chordRoots[chordIndex]);
  scheduleNextChordChange();
}

function playNote(index) {
  ensureAudio();

  const ctx = audioCtx;
  const t0 = ctx.currentTime;
  const freq = currentChord[index % currentChord.length];

  /* voice */
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(freq * 9, t0);
  filter.Q.value = 0.8;

  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0.0001, t0);
  amp.gain.exponentialRampToValueAtTime(0.9, t0 + 0.01);
  amp.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);

  const osc1 = ctx.createOscillator();
  osc1.type = "triangle";
  osc1.frequency.setValueAtTime(freq, t0);

  const osc2 = ctx.createOscillator();
  osc2.type = "sine";
  osc2.frequency.setValueAtTime(freq * 2, t0);
  osc2.detune.setValueAtTime(4 + Math.random() * 5, t0);

  const osc3 = ctx.createOscillator();
  osc3.type = "sine";
  osc3.frequency.setValueAtTime(freq * 0.5, t0);

  const partial = ctx.createGain();
  partial.gain.value = 0.18;

  osc1.connect(filter);
  osc2.connect(filter);
  osc3.connect(partial);
  partial.connect(filter);
  filter.connect(amp);
  amp.connect(master);

  osc1.start(t0);
  osc2.start(t0);
  osc3.start(t0);

  osc1.stop(t0 + 1.8);
  osc2.stop(t0 + 1.8);
  osc3.stop(t0 + 1.8);
}

function scheduleNextChordChange() {
  clearTimeout(chordTimer);

  const delay = 4000 + Math.random() * 3000; // 4–7 sec
  chordTimer = setTimeout(() => {
    chordIndex = (chordIndex + 1) % chordRoots.length;

    /* tiny tuning drift for life */
    const root = chordRoots[chordIndex] * (0.997 + Math.random() * 0.006);
    currentChord = buildChord(root);

    scheduleNextChordChange();
  }, delay);
}
</script>

</body>
</html>
