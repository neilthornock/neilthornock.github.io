<!doctype html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compositions</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<link href="main.css" rel="stylesheet">

<style>
#piece-divider {
  display: none;
}

.breadcrumbs {
  font-size: 0.9rem;
  opacity: 0.7;
}

.breadcrumbs:empty {
  display: none; /* ← this is the key */
}

.breadcrumbs .sep {
  margin: 0 0.3rem;
}

#search {
  display: block;

  /* width will be set by JS */
  width: auto;

  padding: 2px 0;
  margin-bottom: 0.8rem;

  font-family: inherit;
  font-size: 1rem;

  background: transparent;
  border: none;
  border-bottom: 1px solid var(--accent-color); /* green underline */

  color: var(--text-color);
}

#search:focus {
  outline: none;
}

#piece-container {
  line-height: 1.5;
}

#piece-container > * + * {
  margin-top: 0.45rem;
}

#piece-container .movement-list {
  opacity: 0.9;
  margin-bottom: 0;
  padding-left: 0.8rem;
}

#piece-container .movement-list li + li {
  margin-top: 0.12rem;
}

.piece-title + .movement-list {
  margin-top: 0.2rem;
}

#score-link {
  margin-top: 0.7rem;
}

.filters button {
  background: none;
  border: none;
  padding: 0;

  font: inherit;
  color: var(--accent-color);
  cursor: pointer;
}

.filters {
  color: rgba(255,255,255,0.6);
}

.filters .sep {
  margin: 0 0.4rem;
  color: rgba(255,255,255,0.4);
}

.filters button {
  color: var(--accent-color);
  text-decoration: none;
  font: inherit;
  cursor: pointer;
}

.filters button:hover,
.filters button.active-filter {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.filters button.active-filter {
  font-style: italic;
}

.nav-inner {
  display: inline-block;
  white-space: nowrap;
}

#project-label {
  opacity: 0.7;
}
  
</style>

</head>

<body>

<h1><a href="https://www.neilthornock.org">Neil Thornock</a></h1>

<div class="linediv"></div>

<nav class="secondary-nav">
  <span class="nav-inner">
    <a href="/" class="active-nav">Compositions</a>
    <span class="sep">·</span>
    <a href="/projects/">Projects</a>
    <span class="sep">·</span>
    <a href="/gallery.html">Gallery</a>
    <span class="sep">·</span>
    <a href="/bio.html">Bio</a>
  </span>
</nav>

<div class="filters">
  <span class="nav-inner">
    <button onclick="renderCategory(this)">All</button>
    <span class="sep">·</span>
    <button onclick="renderCategory(this, 'carillon')">Carillon</button>
    <span class="sep">·</span>
    <button onclick="renderCategory(this, 'piano')">Piano</button>
    <span class="sep">·</span>
    <button onclick="renderCategory(this, 'organ')">Organ</button>
    <span class="sep">·</span>
    <button onclick="renderCategory(this, 'other')">Other</button>
  </span>
</div>

<input type="text" id="search" placeholder="Search pieces..." autocomplete="off">

<div class="linediv"></div>

<div id="piece-container">
  <div id="breadcrumbs" class="breadcrumbs"></div>
  <h2 class="piece-title" id="piece-title"></h2>
  <ol class="movement-list" id="movements"></ol>
  <p id="description"></p>
  <div id="score-link"></div>
</div>

<div class="linediv" id="piece-divider"></div>

<ul class="movement-list" id="list"></ul>

<script src="pieces.js"></script>

<script>
const list = document.getElementById("list");
const search = document.getElementById("search");

let currentIndex = -1;
let currentItems = [];

function clearPiece() {
  const divider = document.getElementById("piece-divider");

  document.getElementById("breadcrumbs").innerHTML = "";
  document.getElementById("piece-title").textContent = "";
  document.getElementById("movements").innerHTML = "";
  document.getElementById("description").textContent = "";
  document.getElementById("score-link").innerHTML = "";

  if (divider) {
    divider.style.display = "none";
  }

  const params = new URLSearchParams(window.location.search);
  params.delete("piece");

  history.replaceState(
    null,
    "",
    params.toString() ? "?" + params.toString() : location.pathname
  );
}

function setSearchWidth() {
  const nav = document.querySelector(".secondary-nav .nav-inner");
  const filters = document.querySelector(".filters .nav-inner");
  const search = document.getElementById("search");

  if (!nav || !filters || !search) return;

  // measure both lines
  const navWidth = nav.getBoundingClientRect().width;
  const filtersWidth = filters.getBoundingClientRect().width;

  const maxWidth = filtersWidth;
  
  // apply exact pixel width
  search.style.width = `${Math.ceil(maxWidth + 6)}px`;
}

function renderCategory(button, category) {
  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active-filter"));

  button.classList.add("active-filter");

  const params = new URLSearchParams(window.location.search);

  if (category) {
    params.set("category", category);
  } else {
    params.delete("category");
  }

  history.replaceState(null, "", "?" + params.toString());

  clearPiece();
  render(category, search.value);
}

function render(category, filter = "") {
  list.innerHTML = "";
  currentItems = [];

  const params = new URLSearchParams(window.location.search);
  const projectParam = params.get("project");

  Object.entries(pieces)
    .filter(([_, p]) => {
      const matchesCategory = !category || p.category === category;
      const matchesSearch = p.title.toLowerCase().includes(filter.toLowerCase());

      let matchesProject = true;
      if (projectParam && p.project) {
        matchesProject = slugify(p.project) === projectParam;
      }

      return matchesCategory && matchesSearch && matchesProject;
    })
    .sort((a, b) => a[1].title.localeCompare(b[1].title))
    .forEach(([key, p]) => {
      const li = document.createElement("li");
      const a = document.createElement("a");

      const params = new URLSearchParams(window.location.search);
      const currentCategory = params.get("category");

      a.href = `?piece=${key}` + (currentCategory ? `&category=${currentCategory}` : "");

      if (filter) {
        const regex = new RegExp(`(${filter})`, "gi");
        a.innerHTML = p.title.replace(regex, "<mark>$1</mark>");
      } else {
        a.textContent = p.title;
      }

      li.appendChild(a);
      list.appendChild(li);
      currentItems.push(a);
    });

  currentIndex = -1;
}

search.addEventListener("keydown", (e) => {

  if (e.key === "Escape") {
    e.preventDefault();

    search.value = "";

    const params = new URLSearchParams(window.location.search);
    params.delete("search");

    history.replaceState(null, "", params.toString() ? "?" + params.toString() : location.pathname);

    render();
    currentIndex = -1;

    search.focus();
  }

  if (e.key === "ArrowDown") {
    e.preventDefault();
    currentIndex = Math.min(currentIndex + 1, currentItems.length - 1);
    updateActive();
  }

  if (e.key === "ArrowUp") {
    e.preventDefault();
    currentIndex = Math.max(currentIndex - 1, 0);
    updateActive();
  }

  if (e.key === "Enter" && currentItems[currentIndex]) {
    window.location = currentItems[currentIndex].href;
  }
});

function updateActive() {
  currentItems.forEach(a => a.classList.remove("active"));
  if (currentItems[currentIndex]) {
    currentItems[currentIndex].classList.add("active");
    currentItems[currentIndex].scrollIntoView({ block: "nearest" });
  }
}

search.addEventListener("input", () => {
  clearPiece();
  const value = search.value;

  const params = new URLSearchParams(window.location.search);
  if (value) {
    params.set("search", value);
  } else {
    params.delete("search");
  }

  history.replaceState(null, "", "?" + params.toString());

  render(undefined, value);
});

function slugify(str) {
  return str
    .toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^\w\s-]/g, "")   // remove punctuation
    .trim()
    .replace(/\s+/g, "-");      // spaces → hyphens
}

function loadPiece() {
  const params = new URLSearchParams(window.location.search);
  const key = params.get("piece");
  const p = pieces[key];

  const crumbs = document.getElementById("breadcrumbs");
  crumbs.innerHTML = ""; // reset

  const divider = document.getElementById("piece-divider");

  if (!p) {
    divider.style.display = "none";
    return;
  }

  divider.style.display = "block";

  const titleEl = document.getElementById("piece-title");
  titleEl.textContent = p.title;
  document.title = p.title;

  if (p.project) {
    const projectSlug = slugify(p.project);
  
    crumbs.innerHTML = `
      <a href="/projects/">Projects</a>
      <span class="sep">·</span>
      <a href="/projects/${projectSlug}.html">${p.project}</a>
      <span class="sep">·</span>
      ${p.title}
    `;
  }

  const ol = document.getElementById("movements");
  ol.innerHTML = "";

  if (p.movements) {
    p.movements.forEach(m => {
      const li = document.createElement("li");
      li.textContent = m;
      ol.appendChild(li);
    });
    
  }

  document.getElementById("description").textContent = p.description || "";

  if (p.project) {
    const desc = document.getElementById("description");
  
    const projectName = p.project
      .replace(/-/g, " ")
      .replace(/\b\w/g, c => c.toUpperCase());

    const projectSlug = slugify(p.project);

    const projectLink = `
      <p><em>Part of <a href="/projects/${projectSlug}.html">${p.project}</a></em></p>
    `;
    
    desc.innerHTML += projectLink;
  }

  const scoreDiv = document.getElementById("score-link");
  scoreDiv.innerHTML = p.score
    ? `<a href="${p.score}" target="_blank">PDF Score</a>`
    : "";

}

// init
const params = new URLSearchParams(window.location.search);

const initialSearch = params.get("search") || "";
search.value = initialSearch;

const initialCategory = params.get("category");
const initialProject = params.get("project");

render(initialCategory, initialSearch);

const existing = document.getElementById("project-label");
if (existing) existing.remove();

if (initialProject) {
  const label = initialProject
    .replace(/-/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());

  const info = document.createElement("p");
  info.id = "project-label";
  info.textContent = `Project: ${label}`;

  list.parentNode.insertBefore(info, list);
}

if (initialCategory) {
  const btn = document.querySelector(`.filters button[onclick*="${initialCategory}"]`);
  if (btn) btn.classList.add("active-filter");
} else {
  document.querySelector(".filters button").classList.add("active-filter");
}

loadPiece();
search.focus();

// run after layout is ready
window.addEventListener("load", setSearchWidth);

// safety pass
setTimeout(setSearchWidth, 50);

// keep responsive
window.addEventListener("resize", setSearchWidth);
</script>

</body>
</html>
