<script>
const smallWords = ["and", "of", "the", "in"];

function titleFromSlug(slug) {
  return slug
    .split("-")
    .map((word, i) => {
      if (i > 0 && smallWords.includes(word)) return word;
      return word.charAt(0).toUpperCase() + word.slice(1);
    })
    .join(" ");
}

function initProjectBreadcrumbs() {
  const crumbs = document.getElementById("breadcrumbs");
  if (!crumbs) return;

  // get filename (e.g. carillon-cycle.html)
  const path = window.location.pathname;
  const file = path.split("/").pop();

  if (!file) return;

  const slug = file.replace(".html", "");
  const title = titleFromSlug(slug);
  
  document.title = `${title} – Neil Thornock`;
  
  crumbs.innerHTML = `
    <span class="crumb">Projects</span>
    <span class="sep">·</span>
    <span class="crumb">${title}</span>
  `;
}

initProjectBreadcrumbs();
</script>

<script>
let scrollY = 0;

function lockScroll() {
  scrollY = window.scrollY;
  document.body.classList.add("modal-open");
  document.body.style.top = `-${scrollY}px`;
}

function unlockScroll() {
  document.body.classList.remove("modal-open");
  document.body.style.top = "";
  window.scrollTo(0, scrollY);
}

function openModal(content, isPDF = false) {
  const modal = document.getElementById("youtube-modal");
  const frame = modal.querySelector(".yt-frame");
  const inner = modal.querySelector(".yt-modal-inner");

  frame.innerHTML = content;
  if (isPDF) inner.classList.add("pdf-viewer");
  else inner.classList.remove("pdf-viewer");

  modal.classList.add("open");
  lockScroll();
}

function closeModal() {
  const modal = document.getElementById("youtube-modal");
  const frame = modal.querySelector(".yt-frame");
  const inner = modal.querySelector(".yt-modal-inner");

  modal.classList.remove("open");
  inner.classList.remove("pdf-viewer");
  frame.innerHTML = "";
  unlockScroll();
}

document.addEventListener("click", (e) => {
  const ytTrigger = e.target.closest(".youtube-trigger");
  const pdfTrigger = e.target.closest(".pdf-trigger");

  if (ytTrigger) {
    const id = ytTrigger.dataset.id;
    openModal(`
      <iframe
        src="https://www.youtube.com/embed/${id}?autoplay=1"
        allow="autoplay"
        allowfullscreen
      ></iframe>
    `);
  }

  if (pdfTrigger) {
    openPDF(pdfTrigger.dataset.src);
  }

  if (e.target.id === "yt-close" || e.target.id === "youtube-modal") {
    closeModal();
  }
});

function openPDF(src) {
  const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const canInline = !!navigator.pdfViewerEnabled && !isiOS;

  if (!canInline) {
    window.location.href = src;
    return;
  }

  openModal(`
    <iframe
      src="${src}#toolbar=1&navpanes=0&scrollbar=1"
    ></iframe>
  `, true);
}

document.addEventListener("click", (e) => {
  if (e.target.id === "yt-close" || e.target.id === "youtube-modal") {
    closeModal();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const modal = document.getElementById("youtube-modal");
    if (modal.classList.contains("open")) closeModal();
  }
});

const modalInner = document.querySelector(".yt-modal-inner");
if (modalInner) {
  modalInner.addEventListener("click", (e) => e.stopPropagation());
}
</script>

<div id="youtube-modal" class="yt-modal">
  <div class="yt-modal-inner">
    <button id="yt-close">×</button>
    <div class="yt-frame"></div>
  </div>
</div>
</body>
