<script>
const smallWords = ["and", "of", "the", "in"];

function titleFromSlug(slug) {
  return slug
    .split("-")
    .map((word, i) => {
      if (i > 0 && smallWords.includes(word)) return word;
      return word.charAt(0).toUpperCase() + word.slice(1);
    })
    .join(" ");
}

function initProjectBreadcrumbs() {
  const crumbs = document.getElementById("breadcrumbs");
  if (!crumbs) return;

  // get filename (e.g. carillon-cycle.html)
  const path = window.location.pathname;
  const file = path.split("/").pop();

  if (!file) return;

  const slug = file.replace(".html", "");
  const title = titleFromSlug(slug);
  
  document.title = `${title} – Neil Thornock`;
  
  crumbs.innerHTML = `
    <span class="crumb">Projects</span>
    <span class="sep">·</span>
    <span class="crumb">${title}</span>
  `;
}

initProjectBreadcrumbs();
</script>
