<script>
// Schema for composition lists -----------
function stripHTML(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return div.textContent.replace(/\s+/g, " ").trim();
}

function getAbsolutePieceUrl(pieceKey) {
  const url = new URL(window.location.href);
  url.searchParams.set("piece", pieceKey);
  return url.href;
}

function getBaseCompositionsUrl() {
  return `${window.location.origin}/compositions/`;
}

function buildCompositionSchema() {
  const personId = "https://neilthornock.org/#person";
  const params = new URLSearchParams(window.location.search);
  const pieceKey = params.get("piece");
  const piece = pieceKey && pieces[pieceKey] ? pieces[pieceKey] : null;

  if (piece) {
    const schema = {
      "@context": "https://schema.org",
      "@type": "MusicComposition",
      "@id": `${getAbsolutePieceUrl(pieceKey)}#composition`,
      "name": piece.title,
      "url": getAbsolutePieceUrl(pieceKey),
      "composer": {
        "@id": personId
      },
      "isPartOf": {
        "@id": "https://neilthornock.org/compositions/#collection"
      }
    };

    const description = stripHTML(piece.description);
    if (description) schema.description = description;

    return schema;
  }

  const itemListElement = Object.entries(pieces)
    .sort((a, b) => a[1].title.localeCompare(b[1].title))
    .map(([key, piece], index) => ({
      "@type": "ListItem",
      "position": index + 1,
      "item": {
        "@type": "MusicComposition",
        "@id": `${getAbsolutePieceUrl(key)}#composition`,
        "name": piece.title,
        "url": getAbsolutePieceUrl(key),
        "composer": {
          "@id": personId
        }
      }
    }));

  return {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": "https://neilthornock.org/compositions/#collection",
    "url": getBaseCompositionsUrl(),
    "name": "Compositions by Neil Thornock",
    "isPartOf": {
      "@type": "WebSite",
      "url": "https://neilthornock.org/"
    },
    "about": {
      "@id": personId
    },
    "mainEntity": {
      "@type": "ItemList",
      "itemListOrder": "https://schema.org/ItemListUnordered",
      "itemListElement": itemListElement
    }
  };
}

function upsertCompositionSchema() {
  const tag = document.getElementById("compositions-jsonld");
  if (!tag) return;
  tag.textContent = JSON.stringify(buildCompositionSchema());
}

/* call once on load */
upsertCompositionSchema();

/* keep it in sync with SPA route changes */
const originalRenderAll = renderAll;
renderAll = function () {
  originalRenderAll();
  upsertCompositionSchema();
};

window.addEventListener("popstate", upsertCompositionSchema);


// ------------------------

  
const list = document.getElementById("list");
const search = document.getElementById("search");

const mainInstrumentations = new Set(["piano", "organ", "carillon"]);

list.addEventListener("click", (e) => {
  const link = e.target.closest("a");
  if (!link) return;

  const url = new URL(link.href, window.location.href);
  const pieceKey = url.searchParams.get("piece");
  if (!pieceKey) return;

  e.preventDefault();
  openPiece(pieceKey);
});

function getInstrumentationValues(piece) {
  return Array.isArray(piece.instrumentation)
    ? piece.instrumentation
    : [piece.instrumentation];
}

function getInstrumentationLabel(piece) {
  return getInstrumentationValues(piece).join(", ");
}

function matchesInstrumentationFilter(piece, selected) {
  if (!selected || selected === "all") return true;

  const values = getInstrumentationValues(piece).map(v => v.toLowerCase());
  if (selected === "other") {
    return values.some(v => !mainInstrumentations.has(v));
  }
  return values.includes(selected);
}

function syncSearchRowWidth() {
  const searchRow = document.querySelector(".search-row");
  const bioLink = document.querySelector('.secondary-nav a[href*="bio"]');

  if (!searchRow || !bioLink) return;

  // mobile: clear any inline width and let CSS center it
  if (window.matchMedia("(max-width: 600px)").matches) {
    searchRow.style.width = "";
    return;
  }

  const searchLeft = searchRow.getBoundingClientRect().left;
  const bioRight = bioLink.getBoundingClientRect().right;

  searchRow.style.width =
    `${Math.max(0, Math.floor(bioRight - searchLeft))}px`;
}

window.addEventListener("load", syncSearchRowWidth);
window.addEventListener("resize", syncSearchRowWidth);

const searchClear = document.getElementById("search-clear");
updateSearchClear();


updateSearchClear();

function updateSearchClear() {
  const hasText = !!search.value.trim();
  searchClear.style.display = hasText ? "block" : "none";
}



searchClear.addEventListener("click", () => {
  search.value = "";
  updateSearchClear();

  const params = new URLSearchParams(window.location.search);
  params.delete("search");

  history.pushState(null, "", params.toString() ? "?" + params.toString() : location.pathname);
  renderLeftSide();
});




function renderFilterBreadcrumbs() {
  const crumbs = document.getElementById("filter-breadcrumbs");
  const params = new URLSearchParams(window.location.search);

  const project = params.get("project");
  const instrumentation = params.get("instrumentation");

  const parts = [];

  // Project
  if (project) {
    const next = new URLSearchParams(params);
    next.delete("project");

    parts.push(`
      <span class="crumb">
        ${project.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase())}
      </span>
    `);
  }

  // Instrumentation
  if (instrumentation) {
    const next = new URLSearchParams(params);
    next.delete("instrumentation");

    parts.push(`
      <span class="crumb">
        ${instrumentation.replace(/\b\w/g, c => c.toUpperCase())}
      </span>
    `);
  }

  // Clear (removes rightmost breadcrumb only)
  if (parts.length) {
    const next = new URLSearchParams(params);

    if (instrumentation) {
      next.delete("instrumentation");
    } else if (project) {
      next.delete("project");
    }

    parts.push(`
      <a href="${next.toString() ? "?" + next.toString() : location.pathname}">
        clear
      </a>
    `);

    crumbs.innerHTML = parts.join('<span class="sep">·</span>');
  } else {
    crumbs.innerHTML = "";
  }
}

function updateActiveFilter() {
  const params = new URLSearchParams(window.location.search);
  const instrumentation = params.get("instrumentation");

  const buttons = document.querySelectorAll(".filters button");
  buttons.forEach(b => b.classList.remove("active-filter"));

  if (instrumentation === "all") {
    const allBtn = document.querySelector('.filters button[onclick="renderInstrumentation(this)"]');
    if (allBtn) allBtn.classList.add("active-filter");
    return;
  }

  if (!instrumentation) return;

  const btn = document.querySelector(`.filters button[onclick*="${instrumentation}"]`);
  if (btn) btn.classList.add("active-filter");
}

function slugify(str) {
  return str.toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^\w\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-");
}

function getYouTubeEmbedSrc(url) {
  if (!url) return null;

  // Playlist
  const playlistMatch = url.match(/[?&]list=([^&]+)/);
  if (playlistMatch) {
    return `https://www.youtube-nocookie.com/embed/videoseries?list=${playlistMatch[1]}&controls=1&rel=0`;
  }

  // Standard watch URL
  const vMatch = url.match(/[?&]v=([^&]+)/);
  if (vMatch) {
    return `https://www.youtube-nocookie.com/embed/${vMatch[1]}?controls=1&rel=0`;
  }

  // Short URL
  const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
  if (shortMatch) {
    return `https://www.youtube-nocookie.com/embed/${shortMatch[1]}?controls=1&rel=0`;
  }

  return null;
}

function render(instrumentation = "", filter = "") {
  list.style.display = "block";
  list.innerHTML = "";

  const query = filter.toLowerCase();
  const params = new URLSearchParams(window.location.search);
  const projectParam = params.get("project");

  const noFilterState = !instrumentation && !query && !projectParam;
  if (noFilterState) {
    list.innerHTML = `<p id="no-results">Select an instrumentation or search a title.</p>`;
    return;
  }

  Object.entries(pieces)
    .filter(([_, p]) => {
      const matchesInstrumentation = matchesInstrumentationFilter(p, instrumentation);

      const matchesProject = !projectParam || (
        p.project &&
        slugify(p.project) === projectParam
      );

      const matchesTitle = p.title.toLowerCase().includes(query);
      const matchesMovement =
        p.movements && p.movements.some(m => m.toLowerCase().includes(query));

      return matchesInstrumentation && matchesProject && (matchesTitle || matchesMovement || !query);
    })
    .sort((a, b) => a[1].title.localeCompare(b[1].title))
    .forEach(([key, p]) => {
      const li = document.createElement("li");
      const a = document.createElement("a");

      const params = new URLSearchParams(window.location.search);
      params.set("piece", key);
      a.href = "?" + params.toString();

      const titleMatches = p.title.toLowerCase().includes(query);
      let matchedMovement = null;

      if (!titleMatches && p.movements) {
        matchedMovement = p.movements.find(m =>
          m.toLowerCase().includes(query)
        );
      }

      if (filter && titleMatches) {
        const regex = new RegExp(`(${filter})`, "gi");
        a.innerHTML = p.title.replace(regex, "<mark>$1</mark>");
      } else if (matchedMovement) {
        a.innerHTML = `${p.title} <span class="movement-match">(${matchedMovement})</span>`;
      } else {
        a.textContent = p.title;
      }

      li.appendChild(a);
      list.appendChild(li);
    });

  if (list.children.length === 0) {
    const empty = document.createElement("p");
    empty.id = "no-results";
    empty.textContent = "No pieces to show.";
    list.appendChild(empty);
  }
}


function renderLeftSide() {
  const params = new URLSearchParams(window.location.search);
  const instrumentation = params.get("instrumentation");
  const searchVal = params.get("search") || "";

  search.value = searchVal;
  updateSearchClear();

  render(instrumentation, searchVal);
  renderFilterBreadcrumbs();
  updateActiveFilter();
  syncSearchRowWidth();
}

function renderPiecePanel(pieceKey) {
  const container = document.getElementById("piece-container");
  const p = pieceKey ? pieces[pieceKey] : null;

  if (!p) {
    container.style.display = "none";
    document.querySelector(".results-column")?.classList.add("no-piece");

    document.getElementById("piece-title").textContent = "";
    document.getElementById("instrumentation").textContent = "";
    document.getElementById("movements").innerHTML = "";
    document.getElementById("description").textContent = "";
    document.getElementById("project-line").innerHTML = "";
    document.getElementById("related-pages").innerHTML = "";
    document.getElementById("score-link").innerHTML = "";
    document.getElementById("media").innerHTML = "";
    return;
  }

  container.style.display = "block";
  document.querySelector(".results-column")?.classList.remove("no-piece");

  document.getElementById("piece-title").textContent = p.title;
  document.getElementById("instrumentation").textContent = getInstrumentationLabel(p);

  const ol = document.getElementById("movements");
  ol.innerHTML = "";

  if (p.movements) {
    p.movements.forEach(m => {
      const li = document.createElement("li");
      li.textContent = m;
      ol.appendChild(li);
    });
  }

  if (!p.movements && p.movementInfo) {
    const li = document.createElement("li");
    li.textContent = p.movementInfo;
    li.classList.add("movement-meta");
    ol.appendChild(li);
  }

  document.getElementById("description").textContent = p.description || "";

  const projectLine = document.getElementById("project-line");
  if (p.project) {
    const slug = slugify(p.project);
    projectLine.innerHTML = `Part of <a href="/projects/${slug}.html">${p.project}</a>`;
  } else {
    projectLine.innerHTML = "";
  }

  const scoreLink = document.getElementById("score-link");

  if (p.score) {
    scoreLink.innerHTML = `
      <button type="button" class="pdf-trigger media-link" data-src="${p.score}">
        PDF Score
      </button>
    `;
  } else if (p.extScore) {
    const extHref = typeof p.extScore === "string" ? p.extScore : p.extScore.href;
    const extLabel = typeof p.extScore === "string"
      ? "Third-party score ↗"
      : (p.extScore.label || "Third-party score ↗");

    scoreLink.innerHTML = `
      <a class="ext-score-link media-link" href="${extHref}" target="_blank" rel="noopener noreferrer">
        ${extLabel}
      </a>
    `;
  } else {
    scoreLink.innerHTML = "";
  }

  const media = document.getElementById("media");
  media.innerHTML = "";

  const embedSrc = getYouTubeEmbedSrc(p.youtube);
  if (embedSrc) {
    media.innerHTML = `
      <div class="youtube-embed">
        <iframe
          src="${embedSrc}"
          title="${p.title} recording"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>
    `;
  }

  const related = document.getElementById("related-pages");
  related.innerHTML = "";
  if (Array.isArray(p.relatedPages) && p.relatedPages.length) {
    related.innerHTML = `
      <p class="project-line">
        Mentioned in
        ${p.relatedPages.map(page => `<a href="${page.url}">${page.title}</a>`).join(", ")}
      </p>
    `;
  }
}

function openPiece(pieceKey) {
  const params = new URLSearchParams(window.location.search);
  params.set("piece", pieceKey);

  history.pushState(null, "", params.toString() ? "?" + params.toString() : location.pathname);

  renderLeftSide();
  renderPiecePanel(pieceKey);

  if (window.matchMedia("(max-width: 600px)").matches) {
    requestAnimationFrame(() => {
      const panel = document.getElementById("piece-container");
      if (panel && panel.style.display !== "none") {
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  }
}

function renderInstrumentation(button, instrumentation) {
  const params = new URLSearchParams(window.location.search);
  const current = params.get("instrumentation");

  if (!instrumentation) {
    if (current === "all") {
      params.delete("instrumentation");
    } else {
      params.set("instrumentation", "all");
    }
  } else {
    if (current === instrumentation) {
      params.delete("instrumentation");
    } else {
      params.set("instrumentation", instrumentation);
    }
  }

  const nextUrl = params.toString()
    ? `?${params.toString()}`
    : location.pathname;

  history.pushState(null, "", nextUrl);
  renderLeftSide();
}




function renderAll() {
  renderLeftSide();
  renderPiecePanel(new URLSearchParams(window.location.search).get("piece"));
}




document.getElementById("close-piece").addEventListener("click", () => {
  const params = new URLSearchParams(window.location.search);
  params.delete("piece");

  const nextUrl = params.toString()
    ? `?${params.toString()}`
    : location.pathname;

  history.pushState(null, "", nextUrl);
  renderPiecePanel(null);
  renderLeftSide();
});



search.addEventListener("input", () => {
  const params = new URLSearchParams(window.location.search);
  const value = search.value.trim();

  if (value) {
    params.set("search", value);
  } else {
    params.delete("search");
  }

  const nextUrl = params.toString()
    ? `?${params.toString()}`
    : location.pathname;

  history.pushState(null, "", nextUrl);
  renderLeftSide();
});

let scrollY = 0;

function lockScroll() {
  scrollY = window.scrollY;
  document.body.classList.add("modal-open");
  document.body.style.top = `-${scrollY}px`;
}

function unlockScroll() {
  document.body.classList.remove("modal-open");
  document.body.style.top = "";
  window.scrollTo(0, scrollY);
}

document.addEventListener("click", (e) => {
  const pdfTrigger = e.target.closest(".pdf-trigger");

  if (pdfTrigger) {
    openPDF(pdfTrigger.dataset.src);
  }

  if (e.target.id === "yt-close" || e.target.id === "youtube-modal") {
    closeModal();
  }
});

function openPDF(src) {
  const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const canInline = !!navigator.pdfViewerEnabled && !isiOS;

  if (!canInline) {
    window.location.href = src;
    return;
  }

  openModal(`
    <iframe
      src="${src}#toolbar=1&navpanes=0&scrollbar=1"
    ></iframe>
  `, true);
}

function openModal(content, isPDF = false) {
  const modal = document.getElementById("youtube-modal");
  const frame = modal.querySelector(".yt-frame");
  const inner = modal.querySelector(".yt-modal-inner");

  frame.innerHTML = content;

  if (isPDF) {
    inner.classList.add("pdf-viewer");
  } else {
    inner.classList.remove("pdf-viewer");
  }

  modal.classList.add("open");
  lockScroll();
}

function closeModal() {
  const modal = document.getElementById("youtube-modal");
  const frame = modal.querySelector(".yt-frame");
  const inner = modal.querySelector(".yt-modal-inner");

  modal.classList.remove("open");
  inner.classList.remove("pdf-viewer");
  frame.innerHTML = "";

  document.body.classList.remove("modal-open");
  unlockScroll();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const modal = document.getElementById("youtube-modal");

    if (modal.classList.contains("open")) {
      closeModal();
    }
  }
});

function getYouTubeId(url) {
  if (!url) return null;

  const vMatch = url.match(/[?&]v=([^&]+)/);
  if (vMatch) return vMatch[1];

  const shortMatch = url.match(/youtu\.be\/([^?&]+)/);
  if (shortMatch) return shortMatch[1];

  return null;
}
